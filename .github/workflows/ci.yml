name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python tests/run_tests.py
      - name: Smoke — version + config template parses
        run: |
          python agent_memory_doctor.py --version
          python agent_memory_doctor.py --init
          python -c "import json;json.load(open('doctor.json'))"
