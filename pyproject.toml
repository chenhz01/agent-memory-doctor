[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-doctor"
version = "1.4.0"
description = "Boot-time integrity check for AI agent memory & convention files — catch silent convention loss, injection dilution, broken rollback anchors."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-memory-doctor contributors" }]
keywords = ["ai-agents", "llm", "memory", "healthcheck", "agents-md", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/chenhz01/agent-memory-doctor"
Repository = "https://github.com/chenhz01/agent-memory-doctor"
Issues = "https://github.com/chenhz01/agent-memory-doctor/issues"

[project.scripts]
agent-memory-doctor = "agent_memory_doctor:main"

[tool.setuptools]
py-modules = ["agent_memory_doctor"]
